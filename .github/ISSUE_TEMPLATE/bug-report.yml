name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      description: Which plugin is affected?
      options:
        - core-engineering
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Claude Code
        - Cursor
        - Codex
        - OpenCode
        - Other
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill (if applicable)
      description: Which skill is affected?
      placeholder: "e.g. systematic-debugging, brainstorming"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Install the plugin
        2. Start a new session
        3. Ask "..."
        4. See error
    validations:
      required: false
